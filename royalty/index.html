.ev{all:unset;display:block;box-sizing:border-box;width:100%;font-size:11.5px;line-height:1.3;padding:2px 5px;margin-top:3px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ev .ts,.dlist .li .ts{margin-right:2px;flex:none;gap:0}.ev .ts i,.dlist .li .ts i{margin-left:0!important;margin-right:0!important;border:0}.ev .ts i{font-size:9.5px;font-weight:700;padding:0 4px;margin:0;border-radius:0}

}

  if(!rows.length)return`${TOT}<div class="empty">표시할 항목이 없습니다</div>`;
